
name: Build Nova Launcher APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - 
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Nova source
        run: |
          unzip -q NovaLauncher-Android-Source-v0.2.zip -d buildsrc

      - name: Build Nova APK
        run: |
          cd buildsrc/NovaLauncher
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Launcher-APK
          path: buildsrc/NovaLauncher/app/build/outputs/apk/debug/app-debug.apk
          

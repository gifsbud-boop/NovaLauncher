name: Build Nova Launcher APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -q NovaLauncher-Android-Source-v0.2.zip -d buildsrc

      - name: Build Nova
        run: |
          cd buildsrc/NovaLauncher
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Launcher-APK
          path: buildsrc/NovaLauncher/app/build/outputs/apk/debug/app-debug.apk
